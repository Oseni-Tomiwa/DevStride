name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm web:lint
      - run: pnpm web:typecheck
      - run: pnpm web:test
      - run: pnpm web:build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devstride
          POSTGRES_PASSWORD: devstride
          POSTGRES_DB: devstride_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devstride -d devstride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cd apps/api && uv sync --dev
      - run: cd apps/api && uv run ruff check .
      - run: cd apps/api && uv run ruff format --check .
      - run: cd apps/api && uv run pyright
      - run: >-
          cd apps/api &&
          DATABASE_URL=postgresql+asyncpg://devstride:devstride@localhost:5432/devstride_test
          TEST_DATABASE_URL=postgresql+asyncpg://devstride:devstride@localhost:5432/devstride_test
          AI_GENERATION_ENABLED=false
          uv run pytest
